site_name: Отчёт по лабораторным работам по веб-разработке
site_description: FastAPI, PostgreSQL, Docker, потоки, процессы, асинхронность и очереди
site_author: Дмитрий Люсин
repo_url: https://github.com/USERNAME/REPOSITORY
repo_name: GitHub Repository

theme:
  name: mkdocs
  language: ru
  nav_style: dark

nav:
  - Главная: index.md
  - Лабораторная работа 1: lab1.md
  - Лабораторная работа 2: lab2.md
  - Лабораторная работа 3: lab3.md
  - Инструкция запуска: run.md
  - Проверка и защита: check.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - attr_list
